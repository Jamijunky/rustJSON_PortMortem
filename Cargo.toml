[package]
name = "cjson-rs"
version = "0.1.0"
edition = "2021"
description = "Faithful Rust port of the cJSON ANSI-C JSON parser/printer"
license = "MIT"

[lib]
name = "cjson"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]

[dev-dependencies]
cjson-ref-sys = { path = "cjson-ref-sys" }
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }

[profile.release]
debug = true
